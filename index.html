<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f3ee">
<title>JP Vocabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Zen+Old+Mincho:wght@400;700&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app" aria-live="polite"><p class="boot">Loading…</p></div>
<nav id="nav" class="nav" aria-label="Main"></nav>
<div id="toast" class="toast" role="status"></div>
<div id="sheet" class="sheet" aria-hidden="true"><div class="sheet-body" id="sheetBody"></div></div>
<noscript><p style="padding:24px">JP Vocabs needs JavaScript to run.</p></noscript>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="data.js"></script>
<script src="telegram.js"></script>
<script src="app.js"></script>
<script>
setTimeout(function(){var a=document.getElementById('app');if(a&&a.querySelector('.boot')&&!window.VOCAB_DATA){a.innerHTML='<div style="padding:24px;font:16px/1.6 sans-serif"><b>Files could not be loaded.</b><br>Make sure index.html, style.css, data.js, telegram.js and app.js are all uploaded in the same folder.</div>'}},3000);
</script>
</body>
</html>
